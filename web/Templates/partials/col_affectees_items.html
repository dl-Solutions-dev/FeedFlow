<div class="card-header bg-white">
  <div class="fw-semibold">Affectées à @SelectedLangue.libelle</div>
  <small class="text-muted">Langues utilisateur qui pointent vers cette langue portail.</small>
</div>
<div class="list-group list-group-flush">
  @ForEach (var assoc in Affectees) {
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <span class="font-monospace small">@assoc.langueUtilisateur</span>
      <button type="button"
              class="btn btn-sm btn-outline-secondary"
              hx-post="/desaffecter"
              hx-vals='{"langueUtilisateur": "@assoc.langueUtilisateur"}'
              hx-target="#col-non-affectees-list"
              hx-swap="innerHTML"
              aria-label="Retirer l'affectation">
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  }
</div>
