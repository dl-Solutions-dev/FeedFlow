<div class="list-group list-group-flush">
  @ForEach (var region in Regions) {
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center @if region.code = SelectedRegion.code { active }"
         hx-get="/selectRegion"
		 hx-vals='{"code": "@region.code"}'
         hx-target="#col-affectees"
         hx-swap="innerHTML"
         role="button">
	  <div>
        <div>@region.code</div>
      </div>
      <button type="button"
			class="btn btn-sm btn-outline-danger border-0"
			hx-delete="/deleteRegion?code=@region.code"
			hx-target="#col-portail-list"
			hx-swap="innerHTML swap:0.3s"
			hx-confirm="Supprimer définitivement la région « @region.code » ?"
			onclick="event.stopPropagation()">
		<i class="bi bi-trash"></i>
	  </button>
    </div>
  }
</div>
