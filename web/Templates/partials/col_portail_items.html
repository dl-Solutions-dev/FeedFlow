<div class="list-group list-group-flush">
  @ForEach (var langue in Langues) {
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center @if langue.code = SelectedLangue.code { active }"
         hx-get="/selectLanguage?code=@langue.code"
         hx-target="#col-affectees"
         hx-swap="innerHTML"
         role="button">
      <div>
        <div>@langue.libelle</div>
        <small class="@if langue.code = SelectedLangue.code { text-white-50 } @else { text-muted }">@langue.code</small>
      </div>
      <button type="button"
			class="btn btn-sm btn-outline-danger border-0"
			hx-delete="/deleteLanguage?code=@langue.code"
			hx-target="#col-portail-list"
			hx-swap="innerHTML swap:0.3s"
			hx-confirm="Supprimer définitivement la langue « @langue.libelle » ?"
			onclick="event.stopPropagation()">
		<i class="bi bi-trash"></i>
	  </button>
    </div>
  }
</div>
